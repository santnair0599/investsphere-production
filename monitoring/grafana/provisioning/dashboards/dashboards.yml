# Grafana dashboard provider.
# ------------------------------------------------------------------------------
# Tells Grafana to load every dashboard JSON it finds under the mounted path
# (/var/lib/grafana/dashboards) on startup. Drop new *.json files there and they
# appear automatically.
# ------------------------------------------------------------------------------

apiVersion: 1

providers:
  - name: "InvestSphere"
    orgId: 1
    folder: "InvestSphere"
    type: file
    disableDeletion: false
    editable: true
    options:
      # Matches the docker-compose mount of ./grafana/dashboards.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
